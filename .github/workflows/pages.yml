# Builds the static app and publishes it to GitHub Pages:
# https://n-brand.github.io/Jarvis-Mobile/
#
# No secrets here, on purpose. Every VITE_* value ends up readable in the
# public bundle, so nothing private is passed in — the Claude API key is
# entered on each device in the app's settings instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hand tracking's runtime is served from our own origin (see
      # src/lib/hands.ts); locally scripts/start.mjs copies it, here we do.
      - run: cp -r node_modules/@mediapipe/tasks-vision/wasm public/mediapipe
      - run: npm run build
        env:
          PAGES_BASE: /Jarvis-Mobile/
          VITE_BACKEND: direct
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
